<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>카톡방 대시보드</title>
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f2ef;--card:#ffffff;--border:#e8e8e6;--text:#1a1a1a;--sub:#aaa;--accent:#FF6B35;--dim:#666}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;display:flex;flex-direction:column}

i[data-lucide]{display:inline-block;vertical-align:middle}

/* header */
.hdr{padding:20px 20px 12px;background:var(--bg);position:sticky;top:0;z-index:10}
.hdr-title{font-size:18px;font-weight:800}
.hdr-sub{font-size:11px;color:var(--sub);margin-top:2px}

/* scroll area */
#app{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:24px}

/* stat bar */
.stat-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px 14px}
.stat{background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat-n{font-size:22px;font-weight:800}
.stat-l{font-size:9px;color:var(--sub);margin-top:3px;letter-spacing:.03em}

/* status card */
.sec{padding:0 20px;margin-bottom:6px}
.sec-lbl{font-size:10px;font-weight:700;color:#bbb;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.card{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.p{padding:16px 20px}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px;margin-bottom:8px}
.status-pill i[data-lucide]{width:13px;height:13px}
.s-green{background:#e8f5ee;color:#2e7d52}
.s-yellow{background:#fff8e1;color:#a07000}
.s-red{background:#fff0f0;color:#c0392b}
.status-memo{font-size:13px;color:var(--dim);line-height:1.6}

/* chart */
.chart-wrap{position:relative;height:140px;padding:0 20px 16px}

/* table */
.tbl-wrap{padding:0 20px 12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:5px 8px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--border);font-size:11px}
td{padding:8px;border-bottom:1px solid #f8f8f8;color:var(--text)}
tr:last-child td{border-bottom:none}
.rank{color:#bbb;font-size:11px;width:20px}
.nick{font-weight:600}
.badge-days{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.d30{background:#fff8e1;color:#a07000}
.d60{background:#ffe8e8;color:#c0392b}
.d90{background:#f0f0f0;color:#999}
.no-data{color:var(--sub);font-size:12px;padding:8px 0}

/* error */
.err-msg{padding:20px;text-align:center;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-title">카톡방 현황</div>
  <div class="hdr-sub" id="updated-time">로딩 중...</div>
</div>

<div id="app">
  <!-- stats -->
  <div class="stat-bar">
    <div class="stat">
      <div class="stat-n" id="today-msgs">-</div>
      <div class="stat-l">오늘 메시지</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="today-users">-</div>
      <div class="stat-l">오늘 참여자</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="seven-avg-val">-</div>
      <div class="stat-l">7일 평균</div>
    </div>
  </div>

  <!-- status -->
  <div class="sec"><div class="sec-lbl">방 상태</div></div>
  <div class="sec">
    <div class="card p" id="status-card">
      <div class="status-pill" id="status-badge"><i data-lucide="loader"></i> 분석 중</div>
      <div class="status-memo" id="status-memo">...</div>
    </div>
  </div>

  <!-- chart -->
  <div class="sec"><div class="sec-lbl">최근 14일 대화량</div></div>
  <div class="card" style="margin:0 20px 12px">
    <div class="chart-wrap" style="padding:16px 16px 12px"><canvas id="chart"></canvas></div>
  </div>

  <!-- active -->
  <div class="sec"><div class="sec-lbl">활성 멤버 TOP10</div></div>
  <div class="card" style="margin:0 20px 12px">
    <div class="tbl-wrap" style="padding:0">
      <table>
        <thead><tr><th></th><th>닉네임</th><th>메시지</th><th>마지막 활동</th></tr></thead>
        <tbody id="active-body"><tr><td colspan="4" class="no-data" style="padding:12px 8px">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- risk -->
  <div class="sec"><div class="sec-lbl">이탈 위험</div></div>
  <div class="card" style="margin:0 20px 12px">
    <div class="tbl-wrap" style="padding:0">
      <table>
        <thead><tr><th>닉네임</th><th>총 메시지</th><th>침묵</th></tr></thead>
        <tbody id="risk-body"><tr><td colspan="3" class="no-data" style="padding:12px 8px">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function ri(){if(window.lucide)lucide.createIcons();}

async function load(){
  let data;
  try{
    const r=await fetch('data.json?t='+Date.now());
    data=await r.json();
  }catch(e){
    document.getElementById('updated-time').textContent='데이터 없음 (data.json 필요)';
    document.getElementById('status-badge').className='status-pill s-yellow';
    document.getElementById('status-badge').innerHTML='<i data-lucide="alert-circle"></i> 데이터 없음';
    document.getElementById('status-memo').textContent='data.json 파일을 생성하면 실시간 현황이 표시됩니다.';
    document.getElementById('active-body').innerHTML='<tr><td colspan="4" class="no-data" style="padding:12px 8px">데이터 없음</td></tr>';
    document.getElementById('risk-body').innerHTML='<tr><td colspan="3" class="no-data" style="padding:12px 8px">데이터 없음</td></tr>';
    ri();
    return;
  }

  document.getElementById('updated-time').textContent='갱신: '+(data.generated_at||'-');

  const allDates=data.all_dates||[];
  const daily=data.daily||{};
  const latestDate=allDates[allDates.length-1];
  const todayData=latestDate?daily[latestDate]:null;

  document.getElementById('today-msgs').textContent=todayData?todayData.msgs:'-';
  document.getElementById('today-users').textContent=todayData?todayData.users:'-';
  document.getElementById('seven-avg-val').textContent=data.recent_7d_avg||'-';

  const avg=data.recent_7d_avg||0;
  const todayMsgs=todayData?todayData.msgs:0;
  const riskCount=Object.keys(data.at_risk||{}).length;
  let cls,icon,label,memo;
  if(avg>=50&&todayMsgs>=20){
    cls='s-green';icon='check-circle';label='양호';
    memo=`일평균 ${avg}개, 오늘 ${todayMsgs}개. 활성 상태 유지 중.`;
  }else if(avg>=20||todayMsgs>=10){
    cls='s-yellow';icon='alert-triangle';label='주의';
    memo=`일평균 ${avg}개. 대화 유도 콘텐츠가 필요해요. 이탈 위험 ${riskCount}명.`;
  }else{
    cls='s-red';icon='alert-octagon';label='개입 필요';
    memo=`일평균 ${avg}개로 저조. 오늘 직접 대화 트리거 권고. 이탈 위험 ${riskCount}명.`;
  }
  document.getElementById('status-badge').className='status-pill '+cls;
  document.getElementById('status-badge').innerHTML=`<i data-lucide="${icon}"></i>${label}`;
  document.getElementById('status-memo').textContent=memo;

  // chart
  const last14=allDates.slice(-14);
  const labels=last14.map(d=>{const m=d.match(/(\d+)월 (\d+)일/);return m?m[1]+'/'+m[2]:d;});
  const vals=last14.map(d=>daily[d]?daily[d].msgs:0);
  new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{labels,datasets:[{data:vals,backgroundColor:'#FF6B35',borderRadius:5}]},
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9},color:'#aaa'}},
        y:{beginAtZero:true,ticks:{font:{size:9},color:'#aaa'},grid:{color:'#f0f0f0'}}
      },
      responsive:true,maintainAspectRatio:false
    }
  });

  // top10
  const userStats=data.user_stats||{};
  const top10=Object.entries(userStats).slice(0,10);
  const tbody=document.getElementById('active-body');
  if(top10.length===0){
    tbody.innerHTML='<tr><td colspan="4" class="no-data" style="padding:12px 8px">데이터 없음</td></tr>';
  }else{
    tbody.innerHTML=top10.map(([nick,info],i)=>
      `<tr><td class="rank" style="padding-left:12px">${i+1}</td><td class="nick">${nick}</td><td>${info.msgs}</td><td style="color:var(--sub)">${info.last||'-'}</td></tr>`
    ).join('');
  }

  // risk
  const atRisk=data.at_risk||{};
  const rbody=document.getElementById('risk-body');
  const riskEntries=Object.entries(atRisk);
  if(riskEntries.length===0){
    rbody.innerHTML='<tr><td colspan="3" class="no-data" style="padding:12px 8px">이탈 위험 멤버 없음</td></tr>';
  }else{
    rbody.innerHTML=riskEntries.map(([nick,info])=>{
      const days=info.days_silent;
      const c=days>=60?'d60':days>=30?'d30':'d90';
      return`<tr><td class="nick" style="padding-left:12px">${nick}</td><td>${info.msgs}</td><td><span class="badge-days ${c}">${days}일 침묵</span></td></tr>`;
    }).join('');
  }

  ri();
}
load();
</script>
</body>
</html>
