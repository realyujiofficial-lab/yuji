<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>카톡방</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f2f2ef;color:#1a1a1a;font-size:14px;padding:16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.num-box{background:#fff;border-radius:12px;padding:12px 8px;text-align:center}
.num{font-size:22px;font-weight:800}
.lbl{font-size:10px;color:#aaa;margin-top:2px}
.block{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.block-title{font-size:11px;color:#bbb;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.status{font-size:13px;line-height:1.6;color:#444}
.chart-wrap{height:120px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#aaa;font-size:11px;padding:4px 6px;border-bottom:1px solid #eee}
td{padding:7px 6px;border-bottom:1px solid #f5f5f5;color:#1a1a1a}
tr:last-child td{border:none}
.silent{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600}
.d30{background:#fff8e1;color:#a07000}
.d60{background:#ffe8e8;color:#c0392b}
.d90{background:#f0f0f0;color:#999}
.empty{color:#bbb;font-size:12px;padding:6px 0}
</style>
</head>
<body>
<div class="row3">
  <div class="num-box"><div class="num" id="v-msgs">-</div><div class="lbl">오늘 메시지</div></div>
  <div class="num-box"><div class="num" id="v-users">-</div><div class="lbl">오늘 참여자</div></div>
  <div class="num-box"><div class="num" id="v-avg">-</div><div class="lbl">7일 평균</div></div>
</div>

<div class="block">
  <div class="block-title">방 상태</div>
  <div class="status" id="status-text">분석 중...</div>
</div>

<div class="block">
  <div class="block-title">최근 14일</div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</div>

<div class="block">
  <div class="block-title">활성 멤버 TOP10</div>
  <table><thead><tr><th>#</th><th>닉네임</th><th>메시지</th><th>마지막</th></tr></thead>
  <tbody id="t-active"><tr><td colspan="4" class="empty">로딩 중...</td></tr></tbody></table>
</div>

<div class="block">
  <div class="block-title">이탈 위험</div>
  <table><thead><tr><th>닉네임</th><th>총</th><th>침묵</th></tr></thead>
  <tbody id="t-risk"><tr><td colspan="3" class="empty">로딩 중...</td></tr></tbody></table>
</div>

<script>
async function load(){
  let d;
  try{const r=await fetch('data.json?t='+Date.now());d=await r.json();}
  catch(e){
    document.getElementById('status-text').textContent='data.json 없음';
    document.getElementById('t-active').innerHTML='<tr><td colspan="4" class="empty">데이터 없음</td></tr>';
    document.getElementById('t-risk').innerHTML='<tr><td colspan="3" class="empty">데이터 없음</td></tr>';
    return;
  }

  const dates=d.all_dates||[],daily=d.daily||{};
  const latest=dates[dates.length-1],today=latest?daily[latest]:null;
  document.getElementById('v-msgs').textContent=today?today.msgs:'-';
  document.getElementById('v-users').textContent=today?today.users:'-';
  document.getElementById('v-avg').textContent=d.recent_7d_avg||'-';

  const avg=d.recent_7d_avg||0,msgs=today?today.msgs:0,risk=Object.keys(d.at_risk||{}).length;
  const st=avg>=50&&msgs>=20?`양호 — 일평균 ${avg}개, 오늘 ${msgs}개`
    :avg>=20||msgs>=10?`주의 — 일평균 ${avg}개. 이탈 위험 ${risk}명`
    :`개입 필요 — 일평균 ${avg}개 저조. 이탈 위험 ${risk}명`;
  document.getElementById('status-text').textContent=st;

  const l14=dates.slice(-14);
  new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{labels:l14.map(d=>{const m=d.match(/(\d+)월 (\d+)일/);return m?m[1]+'/'+m[2]:d;}),
      datasets:[{data:l14.map(d=>daily[d]?daily[d].msgs:0),backgroundColor:'#FF6B35',borderRadius:4}]},
    options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:9},color:'#aaa'}},y:{beginAtZero:true,ticks:{font:{size:9},color:'#aaa'},grid:{color:'#f5f5f5'}}},responsive:true,maintainAspectRatio:false}
  });

  const top10=Object.entries(d.user_stats||{}).slice(0,10);
  document.getElementById('t-active').innerHTML=top10.length
    ?top10.map(([n,i],x)=>`<tr><td style="color:#bbb">${x+1}</td><td style="font-weight:600">${n}</td><td>${i.msgs}</td><td style="color:#aaa">${i.last||'-'}</td></tr>`).join('')
    :'<tr><td colspan="4" class="empty">없음</td></tr>';

  const risks=Object.entries(d.at_risk||{});
  document.getElementById('t-risk').innerHTML=risks.length
    ?risks.map(([n,i])=>{const c=i.days_silent>=60?'d60':i.days_silent>=30?'d30':'d90';return`<tr><td style="font-weight:600">${n}</td><td>${i.msgs}</td><td><span class="silent ${c}">${i.days_silent}일</span></td></tr>`;}).join('')
    :'<tr><td colspan="3" class="empty">이탈 위험 없음</td></tr>';
}
load();
</script>
</body>
</html>
