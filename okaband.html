<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>놀생 오카방 현황</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background: #f0f2f5; color: #1a1a1a; }
  header { background: #4e7cff; color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; font-weight: 700; }
  header .updated { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .container { padding: 16px; max-width: 640px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .card .value { font-size: 28px; font-weight: 700; color: #4e7cff; }
  .card .sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  .card.full { grid-column: 1 / -1; }
  .status-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .status-card .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 6px 14px; border-radius: 20px; margin-bottom: 8px; }
  .badge.green { background: #e6f9ef; color: #2e7d52; }
  .badge.yellow { background: #fff8e1; color: #a07000; }
  .badge.red { background: #fff0f0; color: #c0392b; }
  .status-card .memo { font-size: 14px; color: #444; line-height: 1.6; }
  .section { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .section h2 { font-size: 14px; font-weight: 700; color: #555; margin-bottom: 12px; }
  .chart-wrap { position: relative; height: 160px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 8px; color: #888; font-weight: 600; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
  td { padding: 8px; border-bottom: 1px solid #f8f8f8; }
  tr:last-child td { border-bottom: none; }
  .rank { color: #bbb; font-size: 12px; width: 20px; }
  .nick { font-weight: 600; }
  .days-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .days-30 { background: #fff8e1; color: #a07000; }
  .days-60 { background: #ffe8e8; color: #c0392b; }
  .days-90 { background: #f0f0f0; color: #999; }
  .no-data { color: #bbb; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>놀생 오카방</h1>
  <div class="updated" id="updated-time">로딩 중...</div>
</header>
<div class="container">
  <div class="cards">
    <div class="card">
      <div class="label">오늘 메시지</div>
      <div class="value" id="today-msgs">-</div>
      <div class="sub" id="today-date">-</div>
    </div>
    <div class="card">
      <div class="label">오늘 참여자</div>
      <div class="value" id="today-users">-</div>
      <div class="sub" id="seven-avg">7일 평균 -개</div>
    </div>
    <div class="card full">
      <div class="label">최근 7일 일평균</div>
      <div class="value" id="seven-avg-val">-</div>
      <div class="sub">메시지/일</div>
    </div>
  </div>

  <div class="status-card" id="status-card">
    <div class="badge" id="status-badge">...</div>
    <div class="memo" id="status-memo">분석 중...</div>
  </div>

  <div class="section">
    <h2>최근 14일 대화량</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="section">
    <h2>활성 멤버 TOP10</h2>
    <table id="active-table">
      <thead><tr><th></th><th>닉네임</th><th>메시지</th><th>마지막 활동</th></tr></thead>
      <tbody id="active-body"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>이탈 위험 멤버</h2>
    <table id="risk-table">
      <thead><tr><th>닉네임</th><th>총 메시지</th><th>침묵</th></tr></thead>
      <tbody id="risk-body"></tbody>
    </table>
  </div>
</div>

<script>
async function load() {
  let data;
  try {
    const r = await fetch('data.json?t=' + Date.now());
    data = await r.json();
  } catch(e) {
    document.getElementById('updated-time').textContent = '데이터 로딩 실패';
    return;
  }

  document.getElementById('updated-time').textContent = '갱신: ' + (data.generated_at || '-');

  const allDates = data.all_dates || [];
  const daily = data.daily || {};

  // 오늘 / 최신 날짜
  const latestDate = allDates[allDates.length - 1];
  const todayData = latestDate ? daily[latestDate] : null;
  document.getElementById('today-msgs').textContent = todayData ? todayData.msgs : '-';
  document.getElementById('today-users').textContent = todayData ? todayData.users : '-';
  document.getElementById('today-date').textContent = latestDate || '-';
  document.getElementById('seven-avg-val').textContent = data.recent_7d_avg || '-';
  document.getElementById('seven-avg').textContent = '7일 평균 ' + (data.recent_7d_avg || '-') + '개';

  // 상태 판정
  const avg = data.recent_7d_avg || 0;
  const todayMsgs = todayData ? todayData.msgs : 0;
  const riskCount = Object.keys(data.at_risk || {}).length;
  let statusClass, statusText, statusMemo;
  if (avg >= 50 && todayMsgs >= 20) {
    statusClass = 'green'; statusText = '🟢 양호';
    statusMemo = `일평균 ${avg}개, 오늘 ${todayMsgs}개. 활성 상태 유지 중.`;
  } else if (avg >= 20 || todayMsgs >= 10) {
    statusClass = 'yellow'; statusText = '🟡 주의';
    statusMemo = `일평균 ${avg}개. 대화 유도 콘텐츠 올려보세요. 이탈 위험 ${riskCount}명.`;
  } else {
    statusClass = 'red'; statusText = '🔴 개입 필요';
    statusMemo = `일평균 ${avg}개로 저조. 오늘 직접 대화 트리거 권고. 이탈 위험 ${riskCount}명.`;
  }
  document.getElementById('status-badge').className = 'badge ' + statusClass;
  document.getElementById('status-badge').textContent = statusText;
  document.getElementById('status-memo').textContent = statusMemo;

  // 14일 차트
  const last14 = allDates.slice(-14);
  const labels = last14.map(d => {
    const m = d.match(/(\d+)월 (\d+)일/);
    return m ? m[1]+'/'+m[2] : d;
  });
  const vals = last14.map(d => (daily[d] ? daily[d].msgs : 0));
  new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data: vals, backgroundColor: '#4e7cff', borderRadius: 4 }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
        y: { beginAtZero: true, ticks: { font: { size: 10 } } }
      },
      responsive: true, maintainAspectRatio: false
    }
  });

  // 활성 멤버 TOP10
  const userStats = data.user_stats || {};
  const top10 = Object.entries(userStats).slice(0, 10);
  const tbody = document.getElementById('active-body');
  if (top10.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="no-data">데이터 없음</td></tr>';
  } else {
    tbody.innerHTML = top10.map(([nick, info], i) =>
      `<tr><td class="rank">${i+1}</td><td class="nick">${nick}</td><td>${info.msgs}</td><td>${info.last || '-'}</td></tr>`
    ).join('');
  }

  // 이탈 위험
  const atRisk = data.at_risk || {};
  const rbody = document.getElementById('risk-body');
  const riskEntries = Object.entries(atRisk);
  if (riskEntries.length === 0) {
    rbody.innerHTML = '<tr><td colspan="3" class="no-data">이탈 위험 멤버 없음 👍</td></tr>';
  } else {
    rbody.innerHTML = riskEntries.map(([nick, info]) => {
      const days = info.days_silent;
      const cls = days >= 60 ? 'days-60' : days >= 30 ? 'days-30' : 'days-90';
      return `<tr><td class="nick">${nick}</td><td>${info.msgs}</td><td><span class="days-badge ${cls}">${days}일 침묵</span></td></tr>`;
    }).join('');
  }
}
load();
</script>
</body>
</html>
