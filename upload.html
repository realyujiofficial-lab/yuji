<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>오카방 로그 업로드</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f2f2ef;min-height:100vh;padding:20px 16px;color:#1a1a1a}
h1{font-size:18px;font-weight:700;margin-bottom:4px;cursor:pointer;user-select:none}
.sub{font-size:13px;color:#888;margin-bottom:24px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:12px}
.card-title{font-size:11px;color:#bbb;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.upload-area{border:2px dashed #ddd;border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.upload-area:active,.upload-area.drag{border-color:#FF6B35;background:#fff8f5}
.upload-icon{font-size:40px;margin-bottom:8px}
.upload-text{font-size:15px;font-weight:600;color:#333;margin-bottom:4px}
.upload-hint{font-size:12px;color:#aaa}
input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.preview-wrap{margin-top:12px;display:none}
.preview-wrap.show{display:block}
.preview-img{width:100%;border-radius:8px;max-height:300px;object-fit:contain;background:#f5f5f5}
.preview-name{font-size:12px;color:#888;margin-top:6px;text-align:center}
.btn{width:100%;padding:16px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-upload{background:#FF6B35;color:#fff}
.btn-upload:disabled{background:#ddd;color:#aaa;cursor:not-allowed}
.btn-upload:active:not(:disabled){opacity:.8}
.status{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;display:none;margin-top:8px}
.status.show{display:block}
.status.loading{background:#fff8e1;color:#b07000}
.status.success{background:#e8f5e9;color:#2e7d32}
.status.error{background:#ffebee;color:#c62828}
.history{margin-top:4px}
.history-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.history-item:last-child{border:none}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.done{background:#4caf50}
.dot.pending{background:#FF6B35}
.dot.error{background:#ef5350}
.history-name{flex:1;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-time{font-size:11px;color:#aaa;flex-shrink:0}
.empty{color:#bbb;font-size:13px;text-align:center;padding:16px 0}

/* 관리자 패널 */
#admin-panel{display:none;margin-top:16px}
#admin-panel.show{display:block}
.admin-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.admin-hdr-title{font-size:16px;font-weight:800}
.admin-refresh{font-size:12px;color:#FF6B35;border:none;background:none;cursor:pointer;padding:4px 8px}
.pending-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pending-item{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pending-thumb{width:100%;aspect-ratio:9/16;object-fit:cover;background:#f0f0f0;display:block}
.pending-thumb.loading{background:#f0f0f0}
.pending-meta{padding:8px 10px 4px;font-size:11px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending-actions{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid #f0f0f0;margin-top:4px}
.pa-btn{padding:10px 0;font-size:18px;border:none;background:none;cursor:pointer;transition:background .15s}
.pa-btn.approve{border-right:1px solid #f0f0f0}
.pa-btn.approve:active{background:#e8f5e9}
.pa-btn.reject:active{background:#ffebee}
.pending-empty{text-align:center;padding:32px;color:#bbb;font-size:14px;grid-column:1/-1}
.admin-badge{display:inline-block;background:#0047AB;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
.pin-wrap{padding:20px;text-align:center}
.pin-inp{width:100%;padding:14px;border-radius:12px;border:1.5px solid #eee;font-size:18px;text-align:center;letter-spacing:.3em;font-weight:700;outline:none;margin-bottom:10px}
.pin-inp:focus{border-color:#0047AB}
.pin-btn{width:100%;padding:13px;border-radius:12px;border:none;background:#0047AB;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<h1 id="title-tap">오카방 로그 업로드</h1>
<p class="sub">카톡 캡쳐 업로드 → 관리자 승인 후 처리</p>

<div class="card">
  <div class="card-title">캡쳐 선택</div>
  <div class="upload-area" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="upload-icon">📸</div>
    <div class="upload-text">캡쳐 사진 선택</div>
    <div class="upload-hint">갤러리에서 선택하거나 드래그</div>
  </div>
  <div class="preview-wrap" id="previewWrap">
    <img class="preview-img" id="previewImg" alt="">
    <div class="preview-name" id="previewName"></div>
  </div>
</div>

<button class="btn btn-upload" id="uploadBtn" disabled>업로드</button>
<div class="status" id="status"></div>

<div class="card" style="margin-top:12px">
  <div class="card-title">최근 업로드</div>
  <div class="history" id="history">
    <div class="empty">업로드 내역이 없습니다</div>
  </div>
</div>

<!-- 관리자 패널 -->
<div id="admin-panel">
  <div id="pin-section" class="card">
    <div class="card-title">관리자 확인</div>
    <div class="pin-wrap">
      <input type="password" id="pin-inp" class="pin-inp" placeholder="PIN" maxlength="6" inputmode="numeric">
      <button class="pin-btn" onclick="checkPin()">확인</button>
    </div>
  </div>
  <div id="admin-section" style="display:none">
    <div class="admin-hdr">
      <div class="admin-hdr-title">대기 중 <span class="admin-badge" id="pending-count">0</span></div>
      <button class="admin-refresh" onclick="loadPending()">새로고침</button>
    </div>
    <div class="pending-grid" id="pending-grid">
      <div class="pending-empty">로딩 중...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://yseynfdirbnlygwpygvp.supabase.co';
const SUPABASE_KEY = 'SUPABASE_KEY_REDACTED';
const BUCKET = 'okaband-screenshots';
const HISTORY_KEY = 'okaband_upload_history';
const ADMIN_PIN = '1234'; // 원하는 PIN으로 변경

let selectedFiles = [];
let tapCount = 0, tapTimer;

// 제목 5번 탭 → 관리자 패널 열기
document.getElementById('title-tap').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => tapCount = 0, 1500);
  if (tapCount >= 5) {
    tapCount = 0;
    document.getElementById('admin-panel').classList.add('show');
    document.getElementById('admin-panel').scrollIntoView({behavior:'smooth'});
  }
});

const fileInput = document.getElementById('fileInput');
const previewWrap = document.getElementById('previewWrap');
const previewImg = document.getElementById('previewImg');
const previewName = document.getElementById('previewName');
const uploadBtn = document.getElementById('uploadBtn');
const statusEl = document.getElementById('status');
const historyEl = document.getElementById('history');

fileInput.addEventListener('change', e => {
  selectedFiles = Array.from(e.target.files);
  if (!selectedFiles.length) return;
  previewWrap.classList.add('show');
  previewImg.src = URL.createObjectURL(selectedFiles[0]);
  previewName.textContent = selectedFiles.length > 1
    ? `${selectedFiles[0].name} 외 ${selectedFiles.length - 1}장`
    : selectedFiles[0].name;
  uploadBtn.disabled = false;
});

uploadBtn.addEventListener('click', async () => {
  if (!selectedFiles.length) return;
  showStatus('loading', `업로드 중... (0/${selectedFiles.length})`);
  uploadBtn.disabled = true;

  const results = [];
  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    showStatus('loading', `업로드 중... (${i+1}/${selectedFiles.length})`);
    try {
      const ts = Date.now();
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `pending/${ts}_${i}.${ext}`;
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': file.type || 'image/jpeg',
        },
        body: file
      });
      if (res.ok) {
        results.push({path, name: file.name, status: 'pending', time: new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})});
        saveHistory(results[results.length - 1]);
      } else {
        results.push({name: file.name, status: 'error', time: new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})});
      }
    } catch(e) {
      results.push({name: file.name, status: 'error', time: new Date().toLocaleTimeString('ko-KR')});
    }
  }

  const ok = results.filter(r => r.status === 'pending').length;
  const fail = results.filter(r => r.status === 'error').length;
  if (fail === 0) {
    showStatus('success', `${ok}장 업로드 완료 — 관리자 승인 후 처리됩니다`);
  } else {
    showStatus('error', `${ok}장 성공 / ${fail}장 실패`);
  }

  selectedFiles = [];
  fileInput.value = '';
  previewWrap.classList.remove('show');
  uploadBtn.disabled = true;
  renderHistory();
});

function showStatus(type, msg) {
  statusEl.className = `status show ${type}`;
  const icons = {loading: '⏳', success: '✅', error: '❌'};
  statusEl.textContent = `${icons[type]} ${msg}`;
}

function saveHistory(item) {
  const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  h.unshift(item);
  if (h.length > 20) h.pop();
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  if (!h.length) {
    historyEl.innerHTML = '<div class="empty">업로드 내역이 없습니다</div>';
    return;
  }
  historyEl.innerHTML = h.slice(0, 10).map(item => `
    <div class="history-item">
      <span class="dot ${item.status}"></span>
      <span class="history-name">${item.name || item.path}</span>
      <span class="history-time">${item.time}</span>
    </div>
  `).join('');
}

// ── 관리자 ──

function checkPin() {
  const val = document.getElementById('pin-inp').value;
  if (val === ADMIN_PIN) {
    document.getElementById('pin-section').style.display = 'none';
    document.getElementById('admin-section').style.display = 'block';
    loadPending();
  } else {
    document.getElementById('pin-inp').value = '';
    document.getElementById('pin-inp').placeholder = '틀렸어요';
    setTimeout(() => document.getElementById('pin-inp').placeholder = 'PIN', 1500);
  }
}

document.getElementById('pin-inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPin();
});

async function listPending() {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({prefix: 'pending/', limit: 100, offset: 0, sortBy: {column: 'created_at', order: 'asc'}})
  });
  const data = await res.json();
  return Array.isArray(data) ? data.filter(f => f.name && f.name !== '.emptyFolderPlaceholder') : [];
}

async function getSignedUrl(path) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({expiresIn: 3600})
  });
  const data = await res.json();
  return data.signedURL ? `${SUPABASE_URL}/storage/v1${data.signedURL}` : '';
}

async function loadPending() {
  const grid = document.getElementById('pending-grid');
  grid.innerHTML = '<div class="pending-empty">불러오는 중...</div>';
  try {
    const files = await listPending();
    document.getElementById('pending-count').textContent = files.length;
    if (!files.length) {
      grid.innerHTML = '<div class="pending-empty">대기 중인 파일 없음</div>';
      return;
    }
    grid.innerHTML = files.map((f, i) => `
      <div class="pending-item" id="pi-${i}">
        <img class="pending-thumb loading" id="thumb-${i}" alt="">
        <div class="pending-meta">${f.name}</div>
        <div class="pending-actions">
          <button class="pa-btn approve" onclick="approveFile('${f.name}', ${i})">⭕</button>
          <button class="pa-btn reject" onclick="rejectFile('${f.name}', ${i})">❌</button>
        </div>
      </div>
    `).join('');
    // 썸네일 로드
    files.forEach(async (f, i) => {
      const url = await getSignedUrl(`pending/${f.name}`);
      const img = document.getElementById(`thumb-${i}`);
      if (img && url) { img.src = url; img.classList.remove('loading'); }
    });
  } catch(e) {
    grid.innerHTML = '<div class="pending-empty">불러오기 실패</div>';
  }
}

async function approveFile(name, idx) {
  const item = document.getElementById(`pi-${idx}`);
  if (item) item.style.opacity = '0.4';
  try {
    // pending/ → 루트로 이동 (copy + delete)
    const copyRes = await fetch(`${SUPABASE_URL}/storage/v1/object/copy`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        bucketId: BUCKET,
        sourceKey: `pending/${name}`,
        destinationBucket: BUCKET,
        destinationKey: name
      })
    });
    if (!copyRes.ok) throw new Error('copy failed');
    await deleteFile(`pending/${name}`);
    if (item) item.remove();
    const count = document.getElementById('pending-count');
    count.textContent = Math.max(0, parseInt(count.textContent) - 1);
  } catch(e) {
    if (item) item.style.opacity = '1';
    alert('승인 실패');
  }
}

async function rejectFile(name, idx) {
  const item = document.getElementById(`pi-${idx}`);
  if (item) item.style.opacity = '0.4';
  try {
    await deleteFile(`pending/${name}`);
    if (item) item.remove();
    const count = document.getElementById('pending-count');
    count.textContent = Math.max(0, parseInt(count.textContent) - 1);
  } catch(e) {
    if (item) item.style.opacity = '1';
    alert('삭제 실패');
  }
}

async function deleteFile(path) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
    method: 'DELETE',
    headers: {
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({prefixes: [path]})
  });
  if (!res.ok) throw new Error('delete failed');
}

renderHistory();
</script>
</body>
</html>
